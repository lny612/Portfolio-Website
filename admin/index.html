<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포트폴리오 문구 편집</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body>
<header><div><span class="eyebrow">NAYOUNG LIM / LOCAL EDITOR</span><h1>포트폴리오 문구 편집<span class="dot">●</span></h1><p>검색하고, 고치고, 확인한 뒤 배포하세요.</p></div><a href="https://portfolio-website-topaz-six-26.vercel.app/" target="_blank" rel="noopener">온라인 사이트 ↗</a></header>
<main><section class="toolbar"><label>문구 검색<input type="search" id="search" placeholder="예: 클락워크 나비, 경력, Contact"></label><label>페이지<select id="page"><option value="">전체 페이지</option></select></label><label class="check"><input type="checkbox" id="dirty-only">수정한 항목만</label><button id="preview">저장 전 미리보기 ↗</button></section>
<div class="notice">한국어와 영어는 각각 수정합니다. 같은 항목이 여러 페이지에 사용되면 함께 반영됩니다. 이미지·영상 안의 글자와 링크 주소는 이 화면의 편집 대상이 아닙니다.</div>
<div class="summary"><span id="count"></span><span id="changes">저장되지 않은 변경 0개</span></div><div id="entries"></div><div class="paging"><button id="previous">← 이전</button><span id="pagination"></span><button id="next">다음 →</button></div>
<section class="review" id="review" hidden><h2>배포 전 확인</h2><p>현재 저장된 모든 문구를 GitHub에 반영하고 공개 사이트에 배포합니다.</p><div id="review-changes"></div><button id="confirm-deploy" class="primary">확인하고 온라인 배포</button><button id="cancel-deploy">취소</button></section>
</main><footer><p id="status" role="status" aria-live="polite">문구를 불러오는 중입니다.</p><div><button id="save">이 컴퓨터에 저장</button><button id="deploy" class="primary">온라인 배포…</button></div></footer>
</body></html>
